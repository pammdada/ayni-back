spring:
  application:
    name: ayni
  datasource:
    url:
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt-enabled: ${APP_SECURITY_JWT_ENABLED:false}
